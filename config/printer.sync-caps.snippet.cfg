# Фрагмент для printer.cfg ОБОИХ принтеров на хосте (два экземпляра Klipper).
# Подключение: [include sync-caps.cfg]  или вставить блок в mainsail.cfg / printer.cfg
#
# После правок: RESTART

[gcode_shell_command sync_caps_sh]
command: /home/pi/bin/sync-caps.sh
timeout: 600.0
verbose: True

[gcode_macro SYNC_CAPS]
description: Синхронизировать gcode из caps/ с головного хоста
gcode:
  RUN_SHELL_COMMAND CMD=sync_caps_sh
  M118 Синхронизация caps завершена — см. лог sync-caps

# Опционально: короткий алиас
[gcode_macro SYNC_GCODE]
description: Алиас SYNC_CAPS
gcode:
  SYNC_CAPS
